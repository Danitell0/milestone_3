[tool.poetry]
name = "call-me-maybe"
version = "0.1.0"
description = "A function calling engine that turns natural language prompts into JSON function calls using token-level decoding."
authors = ["Daniel Filipe Moreira Fernandes <danmorei@student.codam.nl>"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependecies = [
    "numpy>=2.0",
    "pydantic>=2.0",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
